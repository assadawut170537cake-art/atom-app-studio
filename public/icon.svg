<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0)" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Orbital Rings (ATOM orbits) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbit 1 -->
    <ellipse rx="170" ry="60" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="12 8" transform="rotate(-30)" opacity="0.8" />
    <!-- Orbit 2 -->
    <ellipse rx="170" ry="60" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 10" transform="rotate(30)" opacity="0.8" />
    <!-- Orbit 3 -->
    <ellipse rx="170" ry="60" fill="none" stroke="#818cf8" stroke-width="3" transform="rotate(90)" opacity="0.7" />

    <!-- Orbital Electrons / Particles -->
    <circle cx="140" cy="-40" r="8" fill="#ffffff" filter="url(#glow)" />
    <circle cx="-130" cy="50" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="170" r="7" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="0" cy="-170" r="6" fill="#818cf8" filter="url(#glow)" />

    <!-- Inner Core Glow -->
    <circle r="65" fill="url(#coreGrad)" />
    <circle r="28" fill="#ffffff" />
  </g>

  <!-- Title ATOM -->
  <text x="256" y="450" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="#38bdf8" letter-spacing="8">ATOM</text>
</svg>
